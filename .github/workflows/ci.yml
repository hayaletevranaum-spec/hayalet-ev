name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Run strict lint
        run: npm run lint:strict

      - name: Run TypeScript checks
        run: npm run check-types

      - name: Run Laboratory hardening gate
        run: node rooms/laboratory/scripts/laboratory-check.mjs --ci

      - name: Run room core regressions
        run: npm run rooms:test:core

      - name: Build workspace rooms
        run: npm run rooms:build
