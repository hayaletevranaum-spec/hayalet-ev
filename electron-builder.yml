appId: com.hayaletev.app
productName: Hayalet Ev

directories:
  output: release
  buildResources: src/assets

files:
  - AGENTS.md
  - .rovo/**/*
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - third-party-licenses/**/*
  - package.json
  - config/backup-scopes.json
  - data/protocols.json
  - dist/**/*
  - scripts/**/*
  - shared/**/*
  - src/assets/**/*

extraMetadata:
  main: dist/electron/packaged-wrapper-main.js

afterPack: scripts/electron-builder-after-pack.mjs

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/@libsql/win32-x64-msvc/**/*
  - node_modules/koffi/**/*
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-win-x64/**/*
  - node_modules/vosk-koffi/**/*

npmRebuild: false
buildDependenciesFromSource: false

artifactName: hayalet-ev-${version}-${os}-${arch}.${ext}

win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64

portable:
  artifactName: hayalet-ev-${version}-windows-portable.${ext}

linux:
  category: Utility
  icon: src/assets/default.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: hayalet-ev-${version}-linux-${arch}.${ext}
