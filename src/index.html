    <script>
      (() => {
        try {
          const uiMode =
            window.electronAPI?.getStartupFlags?.()?.uiMode === "scene" ? "scene" : "classic";
          document.documentElement.setAttribute("data-ui-mode", uiMode);
        } catch {
          document.documentElement.setAttribute("data-ui-mode", "classic");
        }
      })();
    </script>

    <script>
      (() => {
        const uiMode =
          document.documentElement.getAttribute("data-ui-mode") === "scene" ? "scene" : "classic";
        const splash = document.createElement("div");
        splash.id = "splash-screen";
        splash.className = "splash";
        splash.dataset.uiMode = uiMode;

        const classicMarkup = `
          <div class="splash-content">
            <div class="splash-logo-container">
              <img
                src="./logo.jpg"
                alt=""
                class="splash-logo"
                id="splash-logo"
                data-shell-i18n-alt="app.documentTitle"
              />
              <div class="splash-logo-glow"></div>
            </div>
            <h1 class="splash-title" data-shell-i18n-text="app.documentTitle"></h1>
            <p class="splash-version" data-shell-i18n-text="app.splash.version"></p>
            <div class="splash-loader">
              <div class="splash-progress" id="splash-progress"></div>
            </div>
            <p class="splash-status" id="splash-status" data-shell-i18n-text="app.startup.starting"></p>
          </div>
        `;

        const sceneMarkup = `
          <div class="splash-content splash-content--scene">
            <div class="splash-scene-stage" id="splash-logo">
              <div class="splash-scene-door"></div>
            </div>
            <div class="splash-scene-copy">
              <div class="splash-loader">
                <div class="splash-progress" id="splash-progress"></div>
              </div>
              <p class="splash-status" id="splash-status" data-shell-i18n-text="app.startup.starting"></p>
            </div>
          </div>
        `;

        splash.innerHTML = uiMode === "scene" ? sceneMarkup : classicMarkup;
        document.body.insertBefore(splash, document.body.firstChild);
      })();
    </script>
