<!doctype html>
<html lang="und" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <section
        class="page page-settings settings-page is-hidden"
        id="page-settings"
        aria-labelledby="page-settings-title"
        aria-hidden="true"
      >
        <h2
          class="visually-hidden"
          id="page-settings-title"
          data-shell-i18n-text="settingsHub.openButton"
        ></h2>
        <div
          class="settings-hub-shell settings-page__shell"
          aria-label=""
          data-shell-i18n-aria-label="settingsHub.ariaLabel"
        >
          <div
            class="settings-scene"
            id="settings-scene-root"
            aria-label=""
            data-shell-i18n-aria-label="settingsHub.scene.ariaLabel"
            aria-hidden="true"
            hidden
          >
            <div class="settings-scene__surface scene-shell__surface">
              <img
                class="settings-scene__background scene-shell__cover-image"
                id="settings-scene-background"
                alt=""
              />

              <div
                class="settings-scene__room-view scene-shell__room-layer"
                id="settings-scene-room-view"
                aria-hidden="false"
              >
                <div class="settings-scene__hotspots" id="settings-scene-hotspots"></div>
                <div
                  class="settings-scene__characters entrance-scene__characters"
                  id="settings-scene-characters"
                ></div>
                <div class="entrance-scene__editor-host" id="settings-scene-editor-host"></div>
              </div>

              <div
                class="settings-scene__panel-view scene-shell__view"
                id="settings-scene-panel-view"
                aria-hidden="true"
              >
                <img
                  class="settings-scene__panel-art scene-shell__cover-image"
                  id="settings-scene-panel-art"
                  alt=""
                />
                <div class="settings-scene__panel-shade scene-shell__panel-shade"></div>
                <div class="settings-scene__panel-slot" id="settings-scene-panel-slot"></div>
              </div>
            </div>
          </div>
          <div class="settings-hub-layout">
            <div class="settings-hub-nav workspace-tool-bar">
              <div class="workspace-tool-bar__start">
                <h1
                  class="workspace-tool-bar__title"
                  data-shell-i18n-text="settingsHub.openButton"
                ></h1>
              </div>
              <div
                class="settings-hub-tabs workspace-tool-bar__center"
                role="tablist"
                aria-label=""
                data-shell-i18n-aria-label="settingsHub.ariaLabel"
              >
                <button
                  class="settings-hub-tab is-active"
                  id="settings-tab-accounts"
                  type="button"
                  role="tab"
                  aria-selected="true"
                  aria-controls="settings-panel-accounts"
                  data-settings-panel="accounts"
                >
                  <span class="settings-hub-tab__index">01</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.accounts"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-capture"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="settings-panel-capture"
                  data-settings-panel="capture"
                >
                  <span class="settings-hub-tab__index">02</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.capture"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-theme"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="settings-panel-theme"
                  data-settings-panel="theme"
                >
                  <span class="settings-hub-tab__index">03</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.theme"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-backup"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="backup-overlay"
                  data-settings-panel="backup"
                >
                  <span class="settings-hub-tab__index">04</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.backup"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-rooms"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="rooms-overlay"
                  data-settings-panel="rooms"
                >
                  <span class="settings-hub-tab__index">05</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.rooms"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-live-log"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="live-log-overlay"
                  data-settings-panel="live-log"
                >
                  <span class="settings-hub-tab__index">06</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.liveLog"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-languages"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="settings-panel-languages"
                  data-settings-panel="languages"
                >
                  <span class="settings-hub-tab__index">07</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.languages"
                  ></span>
                </button>
              </div>
              <div class="workspace-tool-bar__end">
                <button
                  class="btn btn-ghost btn-sm settings-hub-close"
                  id="settings-hub-close"
                  data-shell-i18n-text="common.close"
                ></button>
              </div>
            </div>

            <div class="settings-hub-panels">
              <section
                class="settings-hub-panel is-hidden"
                id="settings-panel-capture"
                role="tabpanel"
                aria-labelledby="settings-tab-capture"
                data-settings-panel="capture"
                aria-hidden="true"
                hidden
              >
                <div
                  class="settings-panel-shell scene-shell__framed-shell settings-panel-shell--capture"
                >
                  <div
                    class="settings-panel-head scene-shell__framed-shell-head settings-panel-head--workbench"
                  >
                    <div class="settings-panel-copy">
                      <span
                        class="settings-panel-kicker"
                        data-shell-i18n-text="settingsHub.nav.capture"
                      ></span>
                      <h3
                        class="settings-panel-title"
                        data-shell-i18n-text="settingsHub.capture.title"
                      ></h3>
                      <p
                        class="settings-panel-summary"
                        data-shell-i18n-text="settingsHub.capture.subtitle"
                      ></p>
                    </div>
                  </div>

                  <div class="settings-panel-scroll settings-panel-scroll--capture">
                    <section
                      class="settings-capture-report"
                      aria-label=""
                      data-i18n-aria-label="capture.overview.ariaLabel"
                    >
                      <div class="settings-capture-report-head">
                        <div class="settings-capture-overview">
                          <article
                            class="settings-capture-overview-card"
                            data-capture-summary="host"
                          >
                            <span
                              class="settings-capture-stat-label"
                              data-i18n-text="capture.overview.host"
                            ></span>
                            <strong id="capture-summary-host">--</strong>
                            <p class="settings-capture-note" id="capture-summary-host-note"></p>
                          </article>
                          <article
                            class="settings-capture-overview-card"
                            data-capture-summary="android"
                          >
                            <span
                              class="settings-capture-stat-label"
                              data-i18n-text="capture.overview.android"
                            ></span>
                            <strong id="capture-summary-android">--</strong>
                            <p class="settings-capture-note" id="capture-summary-android-note"></p>
                          </article>
                          <article
                            class="settings-capture-overview-card"
                            data-capture-summary="runtime"
                          >
                            <span
                              class="settings-capture-stat-label"
                              data-i18n-text="capture.overview.runtime"
                            ></span>
                            <strong id="capture-summary-runtime">--</strong>
                            <p class="settings-capture-note" id="capture-summary-runtime-note"></p>
                          </article>
                          <article
                            class="settings-capture-overview-card"
                            data-capture-summary="operation"
                          >
                            <span
                              class="settings-capture-stat-label"
                              data-i18n-text="capture.overview.operation"
                            ></span>
                            <strong id="capture-summary-operation">--</strong>
                            <p
                              class="settings-capture-note"
                              id="capture-summary-operation-note"
                            ></p>
                          </article>
                        </div>

                        <section
                          class="settings-capture-progress"
                          id="capture-android-progress-shell"
                          aria-live="polite"
                        >
                          <div class="settings-capture-progress-header">
                            <strong id="capture-android-progress-title"></strong>
                            <span
                              class="settings-capture-note"
                              id="capture-android-progress-percent"
                            ></span>
                          </div>
                          <div
                            class="settings-capture-progress-bar"
                            role="progressbar"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            aria-valuenow="0"
                          >
                            <span id="capture-android-progress-bar"></span>
                          </div>
                          <p
                            class="settings-capture-note settings-capture-note--status"
                            id="capture-android-progress-message"
                          ></p>
                          <ul
                            class="settings-capture-progress-details"
                            id="capture-android-progress-details"
                          ></ul>
                          <div
                            class="settings-capture-actions settings-capture-actions--progress is-hidden"
                            id="capture-android-progress-actions"
                          >
                            <button
                              id="capture-android-progress-confirm-btn"
                              class="btn btn-primary btn-sm"
                              type="button"
                              data-i18n-text="capture.android.progress.confirm"
                            ></button>
                            <button
                              id="capture-android-progress-cancel-btn"
                              class="btn btn-secondary btn-sm"
                              type="button"
                              data-i18n-text="capture.android.progress.cancel"
                            ></button>
                          </div>
                        </section>
                      </div>

                      <div class="settings-capture-report-body">
                        <section
                          class="settings-capture-report-section settings-capture-report-section--infrastructure"
                        >
                          <section class="settings-capture-report-group">
                            <header class="settings-capture-section-header">
                              <span
                                class="settings-capture-report-title"
                                data-i18n-text="capture.dependencies.title"
                              ></span>
                              <p
                                class="settings-capture-note"
                                data-i18n-text="capture.dependencies.subtitle"
                              ></p>
                            </header>
                            <div class="settings-capture-report-summary">
                              <span
                                class="settings-capture-stat-label"
                                data-i18n-text="capture.dependencies.summaryLabel"
                              ></span>
                              <p
                                class="settings-capture-note"
                                id="capture-host-dependencies-summary"
                              ></p>
                            </div>
                            <div
                              id="capture-host-dependencies-list"
                              class="settings-capture-device-list"
                            ></div>
                            <div class="settings-capture-actions">
                              <button
                                id="capture-host-dependencies-prepare-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.dependencies.actions.prepare"
                              ></button>
                              <button
                                id="capture-host-dependencies-refresh-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.dependencies.actions.refresh"
                              ></button>
                            </div>
                          </section>

                          <section class="settings-capture-report-group">
                            <header class="settings-capture-section-header">
                              <span
                                class="settings-capture-report-title"
                                data-i18n-text="capture.android.title"
                              ></span>
                              <p
                                class="settings-capture-note"
                                data-i18n-text="capture.android.subtitle"
                              ></p>
                            </header>

                            <div class="settings-capture-status-grid">
                              <article class="settings-capture-stat-card">
                                <span
                                  class="settings-capture-stat-label"
                                  data-i18n-text="capture.android.hostStatus"
                                ></span>
                                <strong id="capture-android-host-status">--</strong>
                              </article>
                              <article class="settings-capture-stat-card">
                                <span
                                  class="settings-capture-stat-label"
                                  data-i18n-text="capture.android.deviceCount"
                                ></span>
                                <strong id="capture-android-device-count">--</strong>
                              </article>
                              <article class="settings-capture-stat-card">
                                <span
                                  class="settings-capture-stat-label"
                                  data-i18n-text="capture.android.activeDevice"
                                ></span>
                                <strong id="capture-android-active-device">--</strong>
                              </article>
                              <article class="settings-capture-stat-card">
                                <span
                                  class="settings-capture-stat-label"
                                  data-i18n-text="capture.android.companionStatus"
                                ></span>
                                <strong id="capture-android-companion-status">--</strong>
                              </article>
                            </div>

                            <div class="settings-capture-preview-card">
                              <div class="settings-capture-preview-copy">
                                <span
                                  class="settings-capture-stat-label"
                                  data-i18n-text="capture.android.previewTitle"
                                ></span>
                                <strong id="capture-android-preview-status">--</strong>
                              </div>
                              <p
                                class="settings-capture-note"
                                id="capture-android-preview-note"
                              ></p>
                            </div>

                            <section class="settings-capture-subsection">
                              <span
                                class="settings-capture-stat-label"
                                data-i18n-text="capture.android.detailsSummary"
                              ></span>
                              <div
                                class="settings-capture-status-grid settings-capture-status-grid--detail"
                              >
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.bridgeStatus"
                                  ></span>
                                  <strong id="capture-android-bridge-status">--</strong>
                                </article>
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.permissions"
                                  ></span>
                                  <strong id="capture-android-permissions">--</strong>
                                </article>
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.reverseStatus"
                                  ></span>
                                  <strong id="capture-android-reverse-status">--</strong>
                                </article>
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.expectedVersion"
                                  ></span>
                                  <strong id="capture-android-expected-version">--</strong>
                                </article>
                              </div>
                            </section>

                            <section class="settings-capture-subsection">
                              <span
                                class="settings-capture-stat-label"
                                data-i18n-text="capture.android.scrcpy.available"
                              ></span>
                              <div
                                class="settings-capture-status-grid settings-capture-status-grid--detail"
                              >
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.available"
                                  ></span>
                                  <strong id="capture-scrcpy-available">--</strong>
                                </article>
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.version"
                                  ></span>
                                  <strong id="capture-scrcpy-version">--</strong>
                                </article>
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.mode"
                                  ></span>
                                  <strong id="capture-scrcpy-mode">--</strong>
                                </article>
                                <article class="settings-capture-stat-card">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.device"
                                  ></span>
                                  <strong id="capture-scrcpy-device">--</strong>
                                </article>
                              </div>
                              <div class="settings-capture-diagnostics">
                                <div class="settings-capture-section-header">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.diagnostics"
                                  ></span>
                                  <strong id="capture-scrcpy-feedback">--</strong>
                                </div>
                                <div
                                  class="settings-capture-command-row is-hidden"
                                  id="capture-scrcpy-setup-command-row"
                                >
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.setupCommand"
                                  ></span>
                                  <code id="capture-scrcpy-setup-command"></code>
                                </div>
                                <div class="settings-capture-log-header">
                                  <span
                                    class="settings-capture-stat-label"
                                    data-i18n-text="capture.android.scrcpy.logs"
                                  ></span>
                                  <span
                                    class="settings-capture-note"
                                    id="capture-scrcpy-log-count"
                                  ></span>
                                </div>
                                <p
                                  class="settings-capture-note settings-capture-log-empty"
                                  id="capture-scrcpy-log-empty"
                                  data-i18n-text="capture.android.scrcpy.logsEmpty"
                                ></p>
                                <ul
                                  class="settings-capture-log-list"
                                  id="capture-scrcpy-log-list"
                                  role="log"
                                  aria-live="polite"
                                ></ul>
                              </div>
                            </section>

                            <section class="settings-capture-device-list-shell">
                              <div class="settings-capture-section-header">
                                <span
                                  class="settings-capture-stat-label"
                                  data-i18n-text="capture.android.deviceList.title"
                                ></span>
                                <p
                                  class="settings-capture-note"
                                  data-i18n-text="capture.android.deviceList.subtitle"
                                ></p>
                              </div>
                              <div
                                id="capture-android-device-list"
                                class="settings-capture-device-list"
                              ></div>
                            </section>

                            <div class="settings-capture-actions">
                              <button
                                id="capture-android-scan-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.android.actions.scan"
                              ></button>
                              <button
                                id="capture-android-install-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.android.actions.install"
                              ></button>
                              <button
                                id="capture-android-open-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.android.actions.open"
                              ></button>
                              <button
                                id="capture-android-refresh-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.android.actions.refresh"
                              ></button>
                            </div>

                            <div class="settings-capture-connect-row">
                              <label
                                class="settings-capture-profile-row"
                                for="capture-android-connect-address"
                              >
                                <span data-i18n-text="capture.android.connectAddress"></span>
                                <span class="settings-capture-profile-input">
                                  <input
                                    id="capture-android-connect-address"
                                    class="input input-sm"
                                    type="text"
                                    placeholder="192.168.0.15:5555"
                                  />
                                </span>
                              </label>
                              <button
                                id="capture-android-connect-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="capture.android.actions.connect"
                              ></button>
                            </div>

                            <div class="settings-capture-feedback-stack">
                              <p
                                class="settings-capture-note settings-capture-note--status"
                                id="capture-android-pairing-hint"
                              ></p>
                              <p
                                class="settings-capture-note settings-capture-note--status"
                                id="capture-android-feedback"
                              ></p>
                            </div>
                          </section>
                        </section>

                        <section
                          class="settings-capture-report-section settings-capture-report-section--runtime"
                        >
                          <header class="settings-capture-section-header">
                            <span
                              class="settings-capture-report-title"
                              data-i18n-text="capture.transcript.title"
                            ></span>
                            <p
                              class="settings-capture-note"
                              data-i18n-text="capture.transcript.subtitle"
                            ></p>
                          </header>
                          <section
                            class="user-profile-inline__runtime-panel settings-capture-runtime-panel"
                            aria-labelledby="app-transcript-runtime-label"
                          >
                            <div class="settings-capture-section-header">
                              <label
                                class="form-label"
                                id="app-transcript-runtime-label"
                                for="app-transcript-runtime-ensure-btn"
                                data-i18n-text="user.transcriptRuntime.label"
                              ></label>
                              <p
                                class="settings-capture-note"
                                id="app-transcript-runtime-hint"
                                data-i18n-text="user.transcriptRuntime.hint"
                              ></p>
                            </div>
                            <div class="user-profile-inline__runtime-meta">
                              <article class="user-profile-inline__runtime-stat">
                                <span
                                  id="app-transcript-runtime-status-label"
                                  data-i18n-text="user.transcriptRuntime.statusLabel"
                                ></span>
                                <strong id="app-transcript-runtime-status-value">--</strong>
                              </article>
                              <article class="user-profile-inline__runtime-stat">
                                <span
                                  id="app-transcript-runtime-active-language-label"
                                  data-i18n-text="user.transcriptRuntime.activeLanguageLabel"
                                ></span>
                                <strong id="app-transcript-runtime-active-language">--</strong>
                              </article>
                              <article class="user-profile-inline__runtime-stat">
                                <span
                                  id="app-transcript-runtime-active-model-label"
                                  data-i18n-text="user.transcriptRuntime.activeModelLabel"
                                ></span>
                                <strong id="app-transcript-runtime-active-model">--</strong>
                              </article>
                            </div>
                            <div class="user-profile-inline__runtime-actions">
                              <button
                                id="app-transcript-runtime-ensure-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="user.transcriptRuntime.actions.prepare"
                              ></button>
                              <button
                                id="app-transcript-runtime-refresh-btn"
                                class="btn btn-secondary btn-sm"
                                type="button"
                                data-i18n-text="user.transcriptRuntime.actions.refresh"
                              ></button>
                            </div>
                            <section class="settings-capture-subsection">
                              <span
                                class="settings-capture-stat-label"
                                data-i18n-text="capture.transcript.modelsSummary"
                              ></span>
                              <div
                                class="user-profile-inline__runtime-models"
                                id="app-transcript-runtime-models"
                              ></div>
                            </section>
                            <p
                              class="settings-capture-note user-profile-inline__runtime-feedback"
                              id="app-transcript-runtime-feedback"
                            ></p>
                          </section>
                        </section>
                      </div>
                    </section>
                  </div>
                </div>
              </section>

              <section
                class="settings-hub-panel is-hidden"
                id="settings-panel-theme"
                role="tabpanel"
                aria-labelledby="settings-tab-theme"
                data-settings-panel="theme"
                aria-hidden="true"
                hidden
              >
                <div
                  class="settings-panel-shell scene-shell__framed-shell settings-panel-shell--theme"
                >
                  <div class="settings-panel-head scene-shell__framed-shell-head">
                    <div class="settings-panel-copy">
                      <span
                        class="settings-panel-kicker"
                        data-shell-i18n-text="settingsHub.nav.theme"
