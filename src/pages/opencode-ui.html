<!doctype html>
<html lang="und" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body class="opencode-native-page">
    <main class="app-shell app-shell--opencode" aria-labelledby="opencode-page-title">
      <h1 class="visually-hidden" id="opencode-page-title" data-i18n-text="documentTitle"></h1>
      <div class="ds-workspace-bar">
        <button
          class="ds-workspace-bar__toggle-left ds-workspace-bar__toggle-left--active"
          id="toggle-left"
          title=""
          aria-label=""
          data-i18n-title="workspace.toggleLeftTitle"
          data-i18n-aria-label="workspace.toggleLeftTitle"
        >
          ☰
        </button>
        <div class="ds-workspace-bar__center">
          <button class="ds-workspace-tab ds-workspace-tab--active" id="workspace-active">
            <span class="ds-workspace-tab__icon">📁</span>
            <span data-i18n-text="workspace.mainLabel"></span>
          </button>
          <button
            class="ds-workspace-add"
            id="workspace-add"
            title=""
            aria-label=""
            data-i18n-title="workspace.addTitle"
            data-i18n-aria-label="workspace.addTitle"
          >
            +
          </button>
        </div>
        <button
          class="ds-workspace-bar__toggle-right ds-workspace-bar__toggle-right--active"
          id="toggle-right"
          title=""
          aria-label=""
          data-i18n-title="workspace.toggleRightTitle"
          data-i18n-aria-label="workspace.toggleRightTitle"
        >
          ☰
        </button>
      </div>

      <div class="ds-layout-3col">
        <div class="ds-sidebar" id="sidebar-left">
          <div class="ds-sidebar__header">
            <span class="ds-sidebar__icon">💬</span>
            <span class="ds-sidebar__title" data-i18n-text="session.sidebarTitle"></span>
            <span class="ds-sidebar__subtitle" id="session-count-label"></span>
            <button
              class="ds-sidebar__refresh-btn"
              id="session-refresh-btn"
              title=""
              aria-label=""
              data-i18n-title="session.refreshTitle"
              data-i18n-aria-label="session.refreshTitle"
            >
              ↻
            </button>
          </div>

          <div class="px-2 py-2">
            <button
              class="btn btn-primary w-full"
              id="new-session-btn"
              data-i18n-text="session.newConversation"
            ></button>
          </div>

          <div class="ds-session-tabs" id="session-tabs">
            <button
              class="ds-session-tab is-active"
              id="session-tab-active"
              data-tab="active"
              type="button"
              data-i18n-text="session.tabActive"
            ></button>
            <button
              class="ds-session-tab"
              id="session-tab-archived"
              data-tab="archived"
              type="button"
              data-i18n-text="session.tabArchived"
            ></button>
          </div>

          <div class="ds-sidebar__body">
            <div class="ds-session-list" id="session-list">
              <div class="ds-empty-state" data-i18n-text="common.loading"></div>
            </div>
          </div>

          <div class="ds-sidebar__footer" id="usage-footer">
            <div class="ds-usage">
              <div class="ds-usage__header">
                <span class="ds-usage__title" data-i18n-text="usage.title"></span>
                <span class="ds-usage__value" id="usage-value">—</span>
              </div>
              <div class="ds-progress">
                <div class="ds-progress__track">
                  <div class="ds-progress__fill" id="usage-fill"></div>
                </div>
                <div class="ds-progress__stats" id="usage-stats">
                  <span class="ds-progress__stat" data-i18n-text="common.loading"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="ds-chat" id="chat-area">
          <div
            class="ds-chat__messages"
            id="chat-messages"
            role="log"
            aria-live="polite"
            aria-relevant="additions text"
          >
            <div class="ds-chat__empty" id="chat-empty">
              <img
                class="ds-chat__empty-icon"
                id="logo"
                src="/assets/opencode.png"
                alt=""
                data-i18n-alt="documentTitle"
              />
              <div class="ds-chat__empty-copy">
                <div
                  class="text-sm font-medium text-secondary chat-empty-title"
                  id="chat-empty-title"
                  data-i18n-text="documentTitle"
                ></div>
                <div
                  class="text-xs text-muted chat-empty-subtitle"
                  id="chat-empty-subtitle"
                  data-i18n-text="chat.waitingConnection"
                ></div>
              </div>
            </div>
          </div>

          <div class="ds-chat__input-bar">
            <div class="ds-chat__toolbar">
              <div class="ds-chat__toolbar-left">
                <div class="ds-custom-select" id="mode-dropdown">
                  <button class="ds-custom-select__trigger" type="button">
                    <span
                      class="ds-custom-select__label"
                      data-i18n-text="workspace.modeLabel"
                    ></span>
                  </button>
                  <div class="ds-custom-select__menu"></div>
                </div>
                <div class="ds-custom-select" id="model-dropdown">
                  <button class="ds-custom-select__trigger" type="button">
                    <span
                      class="ds-custom-select__label"
                      data-i18n-text="workspace.modelLabel"
                    ></span>
                  </button>
                  <div class="ds-custom-select__menu"></div>
                </div>
                <button
                  type="button"
                  class="btn btn-ghost btn-xs ds-chat__action-btn"
                  id="model-settings-btn"
                  title=""
                  data-i18n-title="modelSettings.openTitle"
                  data-i18n-text="modelSettings.openLabel"
                ></button>
                <div class="ds-custom-select" id="effort-dropdown">
                  <button class="ds-custom-select__trigger" type="button">
                    <span
                      class="ds-custom-select__label"
                      data-i18n-text="workspace.effortLabel"
                    ></span>
                  </button>
                  <div class="ds-custom-select__menu"></div>
                </div>
              </div>
              <div class="ds-chat__toolbar-right">
                <div class="ds-custom-select ds-chat__interaction-select" id="interaction-dropdown">
                  <button class="ds-custom-select__trigger" type="button">
                    <span
                      class="ds-custom-select__label"
                      data-i18n-text="workspace.interactionLabel"
                    ></span>
                  </button>
                  <div class="ds-custom-select__menu"></div>
                </div>
                <button
                  class="btn btn-secondary btn-xs ds-chat__action-btn"
                  id="prune-btn"
                  title=""
                  data-i18n-title="chat.pruneTitle"
                  data-i18n-text="chat.pruneLabel"
                ></button>
                <button
                  class="btn btn-danger btn-xs ds-chat__action-btn"
                  id="clear-btn"
                  title=""
                  data-i18n-title="chat.clearTitle"
                  data-i18n-text="chat.clearLabel"
                ></button>
                <button
                  class="btn btn-secondary btn-xs ds-chat__action-btn ds-chat__attach-btn"
                  id="attach-file-btn"
                  data-i18n-text="chat.attachFileLabel"
                ></button>
                <button
                  class="btn btn-secondary btn-xs ds-chat__action-btn ds-chat__attach-btn"
                  id="attach-image-btn"
                  title=""
                  data-i18n-title="chat.attachClipboardTitle"
                  data-i18n-text="chat.attachClipboardLabel"
                ></button>
                <input id="attach-file-input" type="file" multiple hidden />
              </div>
            </div>

            <div
              id="clipboard-preview-area"
              class="ds-attachment-tray is-hidden"
              aria-live="polite"
            ></div>

            <div class="ds-chat__input-row">
              <textarea
                class="input ds-chat__textarea"
                id="chat-input"
                aria-label=""
                placeholder=""
                data-i18n-aria-label="chat.inputPlaceholder"
                data-i18n-placeholder="chat.inputPlaceholder"
                rows="3"
              ></textarea>
              <button
                type="button"
                class="btn btn-secondary btn-icon ds-chat__dictation dictation-trigger"
                id="chat-dictation-btn"
                title=""
                aria-label=""
              ></button>
              <button
                class="btn btn-primary btn-icon ds-chat__send"
                id="send-btn"
                title=""
                aria-label=""
                data-i18n-title="chat.sendTitle"
                data-i18n-aria-label="chat.sendTitle"
              >
                ↑
              </button>
            </div>
          </div>
        </div>

        <div class="ds-sidebar ds-sidebar--right" id="sidebar-right">
          <div class="ds-sidebar__body ds-sidebar__body--right">
            <div class="ds-right-inspector">
              <div
                class="ds-right-tabs"
                role="tablist"
                aria-label=""
                data-i18n-aria-label="panel.rightTabsAria"
              >
                <button
                  type="button"
                  id="rtab-btn-todo"
                  class="ds-right-tab"
                  data-rtab="todo"
                  role="tab"
                  aria-selected="false"
                  aria-controls="rtab-todo"
                  tabindex="-1"
                >
                  <span data-i18n-text="panel.todoTitle"></span>
                </button>
                <button
                  type="button"
                  id="rtab-btn-files"
                  class="ds-right-tab"
                  data-rtab="files"
                  role="tab"
                  aria-selected="false"
                  aria-controls="rtab-files"
                  tabindex="-1"
                >
                  <span data-i18n-text="panel.filesTitle"></span>
                </button>
                <button
                  type="button"
                  id="rtab-btn-health"
                  class="ds-right-tab is-active"
                  data-rtab="health"
                  role="tab"
                  aria-selected="true"
                  aria-controls="rtab-health"
                  tabindex="0"
                  data-i18n-text="panel.serverTab"
                ></button>
                <button
                  type="button"
                  id="rtab-visibility-btn"
                  class="ds-right-tabs__toggle"
                  title=""
                  aria-label=""
                  aria-pressed="false"
                  data-i18n-title="panel.tabsHideTitle"
                  data-i18n-aria-label="panel.tabsHideAria"
                >
                  ▾
                </button>
              </div>

              <div class="ds-right-panels">
                <section
                  class="ds-rtab-panel"
                  id="rtab-todo"
                  role="tabpanel"
                  aria-labelledby="rtab-btn-todo"
                >
                  <div class="ds-right-panel-card">
                    <div class="ds-right-panel-card__meta">
                      <div>
                        <div
                          class="ds-right-panel-card__eyebrow"
                          data-i18n-text="panel.todoEyebrow"
                        ></div>
                        <div
                          class="ds-right-panel-card__title"
                          data-i18n-text="panel.todoTitle"
                        ></div>
                      </div>
                    </div>
                    <div class="ds-empty-state" data-i18n-text="panel.todoEmpty"></div>
                  </div>
                </section>

                <section
                  class="ds-rtab-panel"
                  id="rtab-files"
                  role="tabpanel"
                  aria-labelledby="rtab-btn-files"
                >
                  <div class="ds-right-panel-card">
                    <div class="ds-right-panel-card__meta">
                      <div>
                        <div
                          class="ds-right-panel-card__eyebrow"
                          data-i18n-text="panel.filesEyebrow"
                        ></div>
                        <div
                          class="ds-right-panel-card__title"
                          data-i18n-text="panel.filesTitle"
                        ></div>
                      </div>
                    </div>
                    <div class="ds-empty-state" data-i18n-text="panel.filesEmpty"></div>
                  </div>
                </section>

                <section
                  class="ds-rtab-panel ds-rtab-panel--health is-active"
                  id="rtab-health"
                  role="tabpanel"
                  aria-labelledby="rtab-btn-health"
                >
                  <div class="ds-right-panel-card ds-right-panel-card--health" id="health-panel">
                    <div class="ds-right-panel-card__meta">
                      <div>
                        <div
                          class="ds-right-panel-card__eyebrow"
                          data-i18n-text="panel.serverEyebrow"
                        ></div>
                        <div
                          class="ds-right-panel-card__title"
                          data-i18n-text="panel.serverTitle"
                        ></div>
                      </div>
                      <span id="health-badge" class="ds-status-badge ds-status-badge--warning">
                        <span class="ds-status-badge__dot"></span>
                        <span data-i18n-text="panel.serverWaiting"></span>
                      </span>
                    </div>
                    <div class="ds-panel__body ds-panel__body--compact" id="health-panel-body">
                      <div class="ds-kv-row">
                        <button
                          class="btn btn-primary w-full is-hidden"
                          id="mcp-accept-btn"
                          data-i18n-text="health.acceptTerms"
                        ></button>
                      </div>
                      <div class="ds-kv-row">
                        <span class="ds-kv-row__label" data-i18n-text="health.versionLabel"></span>
                        <span class="ds-kv-row__value" id="version">-</span>
                      </div>
                      <div class="ds-kv-row ds-kv-row--url">
                        <span class="ds-kv-row__label" data-i18n-text="health.urlLabel"></span>
                        <div class="ds-kv-row__value ds-kv-row__value--url">
                          <span
                            class="ds-workspace-url-display"
                            id="workspace-url-display"
                            title=""
                            data-i18n-title="health.urlDetailsTitle"
                            >-</span
                          >
                          <button
                            type="button"
                            class="btn btn-xs btn-secondary ds-copy-url-btn"
                            id="btn-copy-url"
                            title=""
                            data-i18n-title="health.copyUrlTitle"
                            data-i18n-text="health.copyUrlLabel"
                          ></button>
                        </div>
                      </div>
                      <div class="ds-kv-row">
                        <span
                          class="ds-kv-row__label"
                          data-i18n-text="health.directoryLabel"
                        ></span>
                        <span class="ds-kv-row__value" id="working-dir">-</span>
                      </div>
                      <div class="ds-kv-row">
                        <span class="ds-kv-row__label" data-i18n-text="health.lspLabel"></span>
                        <span class="ds-kv-row__value" id="lsp-status">-</span>
                      </div>
                      <div class="ds-kv-row">
                        <span class="ds-kv-row__label" data-i18n-text="health.pluginLabel"></span>
                        <span class="ds-kv-row__value" id="plugin-status">-</span>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            </div>

            <div class="ds-right-secondary">
              <div class="ds-panel ds-panel--collapsed">
                <div class="ds-panel__header" data-toggle="prompts-panel-body">
                  <span class="ds-panel__title" data-i18n-text="panel.promptsTitle"></span>
                  <span class="ds-panel__count" id="prompt-count">0</span>
                  <span class="ds-panel__chevron">▾</span>
                </div>
                <div class="ds-panel__body" id="prompts-panel-body">
                  <button
                    class="ds-panel__add"
                    id="add-prompt-btn"
                    data-i18n-text="panel.addPrompt"
                  ></button>
                  <div id="prompts-list">
                    <div class="ds-empty-state" data-i18n-text="common.loading"></div>
                  </div>
                </div>
              </div>

              <div class="ds-modal" id="prompt-modal">
                <div class="ds-modal__overlay" id="prompt-modal-overlay"></div>
                <div class="ds-modal__content">
                  <h3
                    class="ds-modal__title"
                    id="prompt-modal-title"
                    data-i18n-text="prompt.modalTitle"
                  ></h3>
                  <div class="ds-modal__field">
                    <label
                      class="ds-modal__label"
                      for="prompt-modal-name"
                      data-i18n-text="prompt.nameLabel"
                    ></label>
                    <input
                      type="text"
                      class="input ds-modal__input"
                      id="prompt-modal-name"
                      placeholder=""
                      data-i18n-placeholder="prompt.namePlaceholder"
                    />
                  </div>
                  <div class="ds-modal__field">
                    <label class="ds-modal__label" data-i18n-text="prompt.contentLabel"></label>
                    <textarea
                      class="input ds-modal__textarea"
                      id="prompt-modal-content"
                      rows="5"
                      placeholder=""
                      data-i18n-placeholder="prompt.contentPlaceholder"
                    ></textarea>
                  </div>
                  <div class="ds-modal__actions">
                    <button
                      class="ds-modal__btn ds-modal__btn--secondary btn btn-sm btn-secondary"
                      id="prompt-modal-cancel"
                      data-i18n-text="prompt.cancel"
                    ></button>
                    <button
                      class="ds-modal__btn ds-modal__btn--primary btn btn-sm btn-primary"
                      id="prompt-modal-save"
                      data-i18n-text="prompt.save"
                    ></button>
                  </div>
                </div>
              </div>

              <div class="ds-modal" id="model-settings-modal">
                <div class="ds-modal__overlay" id="model-settings-backdrop"></div>
                <div class="ds-modal__content ds-modal__content--wide model-settings-modal">
                  <div class="model-settings__header">
                    <div>
                      <h3 class="ds-modal__title" data-i18n-text="modelSettings.title"></h3>
                      <p
                        class="model-settings__subtitle"
                        data-i18n-text="modelSettings.subtitle"
                      ></p>
                    </div>
                    <button
                      type="button"
                      class="btn btn-ghost btn-xs ds-chat__action-btn"
                      id="model-settings-close"
                      title=""
                      aria-label=""
                      data-i18n-title="modelSettings.closeTitle"
                      data-i18n-aria-label="modelSettings.closeTitle"
                    >
                      ✕
                    </button>
                  </div>

                  <div class="model-settings__summary" id="model-settings-summary"></div>

                  <div class="model-settings__filters">
                    <input
                      type="search"
                      class="input ds-modal__input"
                      id="model-settings-search"
                      aria-label=""
                      placeholder=""
                      data-i18n-aria-label="modelSettings.searchPlaceholder"
                      data-i18n-placeholder="modelSettings.searchPlaceholder"
                    />
                    <label
                      class="model-settings__checkbox ds-choice-chip ds-choice-chip--segmented ds-choice-chip--dense"
                    >
                      <input type="checkbox" id="model-settings-favorites-only" />
                      <span data-i18n-text="modelSettings.favoritesOnly"></span>
                    </label>
                    <label
                      class="model-settings__checkbox ds-choice-chip ds-choice-chip--segmented ds-choice-chip--dense"
                    >
                      <input type="checkbox" id="model-settings-show-hidden" />
                      <span data-i18n-text="modelSettings.showHidden"></span>
                    </label>
                  </div>

                  <div class="model-settings__layout">
                    <section class="model-settings__panel model-settings__panel--providers">
                      <div
                        class="model-settings__panel-title"
                        data-i18n-text="modelSettings.providerSectionTitle"
                      ></div>
                      <div class="model-settings__provider-list" id="model-settings-provider-list">
                        <div
                          class="ds-empty-state"
                          data-i18n-text="modelSettings.providersLoading"
                        ></div>
                      </div>
                    </section>

                    <section class="model-settings__panel model-settings__panel--models">
                      <div
                        class="model-settings__panel-title"
                        data-i18n-text="modelSettings.modelSectionTitle"
                      ></div>
                      <div class="model-settings__model-list" id="model-settings-model-list">
                        <div
                          class="ds-empty-state"
                          data-i18n-text="modelSettings.modelsLoading"
                        ></div>
                      </div>
                    </section>
                  </div>
                </div>
              </div>

              <div class="ds-panel ds-panel--collapsed is-hidden" id="mcp-panel">
                <div class="ds-panel__header" data-toggle="mcp-panel-body">
                  <span class="ds-panel__title" data-i18n-text="panel.mcpTitle"></span>
                  <span class="ds-panel__count" id="mcp-count">0</span>
                  <span class="ds-panel__chevron">▾</span>
                </div>
                <div class="ds-panel__body" id="mcp-panel-body">
                  <div id="mcp-list"></div>
                </div>
              </div>

              <div class="ds-panel ds-panel--collapsed">
                <div class="ds-panel__header" data-toggle="tools-panel-body">
                  <span class="ds-panel__title" data-i18n-text="panel.toolsTitle"></span>
                  <span class="ds-panel__count" id="tool-count">0</span>
                  <span class="ds-panel__chevron">▾</span>
                </div>
                <div class="ds-panel__body" id="tools-panel-body">
                  <input
                    class="ds-panel__search"
                    id="tool-search"
                    type="text"
                    aria-label=""
                    placeholder=""
                    data-i18n-aria-label="panel.toolsSearchPlaceholder"
                    data-i18n-placeholder="panel.toolsSearchPlaceholder"
                  />
                  <div id="tools-list">
                    <div class="ds-empty-state" data-i18n-text="common.loading"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="ds-footer-bar">
            <span id="last-check">—</span>
            <span id="error-area" role="status" aria-live="polite"></span>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/js/pages/opencode-ui/app.ts"></script>
  </body>
</html>
